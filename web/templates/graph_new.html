{% extends "base.html" %}
{% block title %}Create graph — agent-knowledge-graph{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create graph</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Name<input type="text" name="name" required maxlength="120"></label>
    <label>Description (optional)<textarea name="description" rows="3"></textarea></label>
    <button type="submit" class="button">Create graph</button>
  </form>
</section>
{% endblock %}
