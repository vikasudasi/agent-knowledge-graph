[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-knowledge-graph"
version = "0.1.0"
description = "Persistent knowledge graph memory for AI agents — Neo4j + vector search + NL→Cypher"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "agent-knowledge-graph contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "neo4j>=5.20",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "sentence-transformers>=3.0",
    "pygments>=2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.0",
]
hermes = [
    "hermes-agent>=0.19.0",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
kg = "cli.main:app"

[tool.setuptools.packages.find]
include = ["core*", "pipelines*", "adapters*", "cli*", "tests*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=core --cov=cli --cov=pipelines --cov-report=term-missing"
asyncio_mode = "auto"
