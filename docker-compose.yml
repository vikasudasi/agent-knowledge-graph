version: "3.8"

services:
  neo4j:
    image: neo4j:5-enterprise
    container_name: kg-neo4j
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # HTTP browser
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 2G
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password \"RETURN 1\" || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      app: agent-knowledge-graph
      component: neo4j
      description: "Neo4j Enterprise 5 with APOC vector support"

volumes:
  neo4j_data:
  neo4j_logs: